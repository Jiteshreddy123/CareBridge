<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareBridge NCG — Multilingual Cancer Follow-up & Care-Instruction Closure Platform</title>
  <meta name="description"
    content="CareBridge NCG: India's first multilingual follow-up closure platform for the National Cancer Grid. Bridging the gap between oncology discharge and patient action.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* =========================================================================
   DESIGN SYSTEM — Earthy, Warm, Premium
   ========================================================================= */
    :root {
      /* Core palette */
      --bg: #F5F2EC;
      --bg-warm: #FAF8F4;
      --surface: #FFFFFF;
      --surface-dim: #F0EDE6;
      --surface-muted: #E8E4DB;
      --ink: #1E2D29;
      --ink-secondary: #3D5650;
      --ink-muted: #6E837D;
      --border: #DDD8CD;
      --border-strong: #C9C2B4;

      /* Brand: Deep forest green */
      --brand: #1B4D42;
      --brand-mid: #287A68;
      --brand-light: #35997F;
      --brand-tint: #E0F0EB;
      --brand-subtle: #F0F8F5;

      /* Accent: Warm gold */
      --gold: #C28B2D;
      --gold-dark: #8D6520;
      --gold-tint: #FAF0DA;
      --gold-subtle: #FDF8EE;

      /* Alert: Terracotta */
      --alert: #B44A3A;
      --alert-tint: #FAEAE7;
      --alert-subtle: #FDF5F3;

      /* Radii */
      --r-xs: 6px;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;
      --r-full: 9999px;

      /* Shadows */
      --sh-xs: 0 1px 3px rgba(30, 45, 41, 0.04);
      --sh-sm: 0 2px 8px rgba(30, 45, 41, 0.06);
      --sh-md: 0 8px 24px -4px rgba(30, 45, 41, 0.08);
      --sh-lg: 0 16px 40px -8px rgba(30, 45, 41, 0.12);
      --sh-xl: 0 24px 56px -12px rgba(30, 45, 41, 0.18);

      /* Typography */
      --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
      --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

      /* Transitions */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* ---- RESET ---- */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.55;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--serif);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.25;
    }

    p {
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: var(--sans);
      cursor: pointer;
      border: none;
      background: none;
    }

    input,
    select,
    textarea {
      font-family: var(--sans);
    }

    ul {
      list-style: none;
    }

    /* ---- UTILITY CLASSES ---- */
    .flex {
      display: flex;
    }

    .flex-col {
      flex-direction: column;
    }

    .items-center {
      align-items: center;
    }

    .justify-between {
      justify-content: space-between;
    }

    .justify-center {
      justify-content: center;
    }

    .gap-4 {
      gap: 4px;
    }

    .gap-6 {
      gap: 6px;
    }

    .gap-8 {
      gap: 8px;
    }

    .gap-10 {
      gap: 10px;
    }

    .gap-12 {
      gap: 12px;
    }

    .gap-16 {
      gap: 16px;
    }

    .gap-20 {
      gap: 20px;
    }

    .gap-24 {
      gap: 24px;
    }

    .text-xs {
      font-size: 11px;
    }

    .text-sm {
      font-size: 12.5px;
    }

    .text-base {
      font-size: 14px;
    }

    .text-lg {
      font-size: 16px;
    }

    .text-xl {
      font-size: 18px;
    }

    .text-2xl {
      font-size: 22px;
    }

    .text-3xl {
      font-size: 28px;
    }

    .text-4xl {
      font-size: 36px;
    }

    .font-medium {
      font-weight: 500;
    }

    .font-semibold {
      font-weight: 600;
    }

    .font-bold {
      font-weight: 700;
    }

    .font-extrabold {
      font-weight: 800;
    }

    .text-muted {
      color: var(--ink-muted);
    }

    .text-secondary {
      color: var(--ink-secondary);
    }

    .text-brand {
      color: var(--brand);
    }

    .text-gold {
      color: var(--gold-dark);
    }

    .text-alert {
      color: var(--alert);
    }

    .text-white {
      color: #fff;
    }

    .mono {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    }

    .uppercase {
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .truncate {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .w-full {
      width: 100%;
    }

    .text-center {
      text-align: center;
    }

    .flex-1 {
      flex: 1;
    }

    .relative {
      position: relative;
    }

    .flex-wrap {
      flex-wrap: wrap;
    }

    .hidden {
      display: none !important;
    }

    .mb-4 {
      margin-bottom: 4px;
    }

    .mb-8 {
      margin-bottom: 8px;
    }

    .mb-12 {
      margin-bottom: 12px;
    }

    .mb-16 {
      margin-bottom: 16px;
    }

    .mb-20 {
      margin-bottom: 20px;
    }

    .mb-24 {
      margin-bottom: 24px;
    }

    .mb-32 {
      margin-bottom: 32px;
    }

    .mt-8 {
      margin-top: 8px;
    }

    .mt-12 {
      margin-top: 12px;
    }

    .mt-16 {
      margin-top: 16px;
    }

    .pt-12 {
      padding-top: 12px;
    }

    .border-t {
      border-top: 1px solid var(--border);
    }

    /* ---- BUTTONS ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: var(--r-full);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.18s var(--ease);
      white-space: nowrap;
      border: 1.5px solid transparent;
      line-height: 1;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-brand {
      background: var(--brand);
      color: #fff;
    }

    .btn-brand:hover {
      background: var(--brand-mid);
      box-shadow: var(--sh-sm);
    }

    .btn-gold {
      background: var(--gold);
      color: #fff;
    }

    .btn-gold:hover {
      background: #A97826;
    }

    .btn-outline {
      background: transparent;
      color: var(--brand);
      border-color: var(--border-strong);
    }

    .btn-outline:hover {
      border-color: var(--brand);
      background: var(--brand-subtle);
    }

    .btn-soft {
      background: var(--surface-dim);
      color: var(--ink);
    }

    .btn-soft:hover {
      background: var(--surface-muted);
    }

    .btn-danger {
      background: var(--alert);
      color: #fff;
    }

    .btn-danger:hover {
      background: #9B3E31;
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 12px;
    }

    .btn-xs {
      padding: 5px 10px;
      font-size: 11px;
    }

    .btn-block {
      width: 100%;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 50%;
    }

    /* ---- PILLS / BADGES ---- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: var(--r-full);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.4;
    }

    .pill-brand {
      background: var(--brand-tint);
      color: var(--brand);
    }

    .pill-gold {
      background: var(--gold-tint);
      color: var(--gold-dark);
    }

    .pill-alert {
      background: var(--alert-tint);
      color: var(--alert);
    }

    .pill-neutral {
      background: var(--surface-dim);
      color: var(--ink-muted);
    }

    .pill-white {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* ---- CARDS ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 24px;
      box-shadow: var(--sh-xs);
      transition: box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
    }

    .card:hover {
      box-shadow: var(--sh-sm);
    }

    .card-compact {
      padding: 16px;
    }

    .card-flush {
      padding: 0;
    }

    /* ---- GRID ---- */
    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    /* ---- TOP SYSTEM BAR ---- */
    .system-bar {
      background: #13201D;
      color: #C4D4CF;
      font-size: 11px;
      padding: 7px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .system-badge {
      background: rgba(40, 122, 104, 0.35);
      color: #7DE0C8;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ---- HEADER ---- */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(245, 242, 236, 0.92);
      backdrop-filter: blur(12px) saturate(1.4);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--r-sm);
      background: linear-gradient(135deg, var(--brand), var(--brand-mid));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: var(--sh-sm);
    }

    .logo-text {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 20px;
      color: var(--ink);
      line-height: 1.1;
    }

    .logo-sub {
      font-size: 10px;
      color: var(--ink-muted);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .logo-ncg {
      font-family: var(--sans);
      font-weight: 800;
      font-size: 13px;
      color: var(--brand-mid);
      margin-left: 2px;
    }

    /* ---- ROLE TABS ---- */
    .role-tabs {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: var(--r-full);
      box-shadow: var(--sh-xs);
    }

    .role-tab {
      padding: 7px 16px;
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      transition: all 0.15s var(--ease);
      white-space: nowrap;
    }

    .role-tab:hover {
      color: var(--ink);
      background: var(--surface-dim);
    }

    .role-tab.active {
      background: var(--brand);
      color: #fff;
      box-shadow: 0 1px 4px rgba(27, 77, 66, 0.25);
    }

    /* ---- LANGUAGE SELECTOR ---- */
    .lang-wrap {
      position: relative;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: var(--r-full);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      box-shadow: var(--sh-xs);
      transition: all 0.15s var(--ease);
    }

    .lang-btn:hover {
      border-color: var(--brand);
      box-shadow: var(--sh-sm);
    }

    .lang-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 290px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      box-shadow: var(--sh-xl);
      z-index: 60;
      overflow: hidden;
      max-height: 420px;
      overflow-y: auto;
      animation: dropIn 0.15s var(--ease);
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .lang-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      width: 100%;
      text-align: left;
      border-bottom: 1px solid var(--surface-dim);
      transition: background 0.1s;
      font-size: 13px;
    }

    .lang-option:last-child {
      border-bottom: none;
    }

    .lang-option:hover {
      background: var(--bg-warm);
    }

    .lang-option.active {
      background: var(--brand-tint);
      color: var(--brand);
    }

    /* ---- HERO DEMO BANNER ---- */
    .demo-banner {
      background: linear-gradient(90deg, #13201D 0%, #1A3028 100%);
      color: #E0E8E5;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #2A3F38;
      font-size: 12px;
    }

    .demo-step-label {
      color: #E6B566;
      font-weight: 700;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .demo-dots {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }

    .demo-dot {
      width: 28px;
      height: 4px;
      border-radius: 2px;
      background: #2D4840;
      cursor: pointer;
      transition: background 0.2s;
    }

    .demo-dot.done {
      background: #52B097;
    }

    .demo-dot.active {
      background: #E6B566;
      box-shadow: 0 0 8px rgba(230, 181, 102, 0.5);
    }

    /* ---- PHONE FRAME ---- */
    .phone-wrap {
      display: flex;
      justify-content: center;
      padding: 32px 20px;
      align-items: flex-start;
    }

    .phone {
      width: 400px;
      height: min(780px, calc(100vh - 160px));
      background: var(--bg);
      border-radius: 48px;
      box-shadow: 0 0 0 11px var(--brand), 0 0 0 12px rgba(27, 77, 66, 0.3), 0 40px 80px -20px rgba(27, 77, 66, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      flex-shrink: 0;
    }

    .phone-notch {
      width: 110px;
      height: 18px;
      background: #0F1C18;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
    }

    .phone-screen {
      flex: 1;
      overflow-y: auto;
      display: block;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .phone-screen::-webkit-scrollbar {
      width: 4px;
    }

    .phone-screen::-webkit-scrollbar-track {
      background: transparent;
    }

    .phone-screen::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .phone-screen::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }

    /* ---- PATIENT PASS HEADER ---- */
    .pass-head {
      background: linear-gradient(145deg, var(--brand) 0%, var(--brand-mid) 60%, #1A5A4A 100%);
      color: #fff;
      padding: 30px 20px 22px;
      border-bottom-left-radius: var(--r-xl);
      border-bottom-right-radius: var(--r-xl);
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
    }

    .pass-head::before {
      content: '';
      position: absolute;
      top: -30%;
      right: -20%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .pass-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-sizing: border-box;
    }

    /* ---- JOURNEY RAIL ---- */
    .rail {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 4px 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .rail-bg {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 28px;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }

    .rail-fill {
      position: absolute;
      left: 22px;
      top: 28px;
      height: 2px;
      background: var(--brand);
      z-index: 1;
      transition: width 0.4s var(--ease);
    }

    .rail-node {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 44px;
      flex: 1;
      cursor: pointer;
    }

    .rail-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--ink-muted);
      margin-bottom: 5px;
      transition: all 0.2s var(--ease);
    }

    .rail-node.done .rail-dot {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .rail-node.current .rail-dot {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
      box-shadow: 0 0 0 4px var(--gold-tint);
    }

    .rail-node.attn .rail-dot {
      background: var(--alert);
      border-color: var(--alert);
      color: #fff;
      box-shadow: 0 0 0 4px var(--alert-tint);
    }

    .rail-txt {
      font-size: 9px;
      font-weight: 600;
      color: var(--ink-muted);
      line-height: 1.18;
      word-break: break-word;
      max-width: 48px;
    }

    .rail-node.done .rail-txt {
      color: var(--brand);
    }

    .rail-node.current .rail-txt {
      color: var(--gold-dark);
      font-weight: 700;
    }

    /* ---- ACTION CARDS ---- */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px;
      box-shadow: var(--sh-xs);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .task-card:hover {
      border-color: var(--brand-mid);
      box-shadow: var(--sh-sm);
    }

    .task-card.completed {
      border-color: #B8DCC8;
      background: #F5FBF8;
    }

    .task-card.completed .task-title {
      text-decoration: line-through;
      opacity: 0.7;
    }

    .task-info-box {
      background: var(--surface-dim);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.55;
    }

    /* ---- MODAL ---- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 35, 30, 0.55);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.15s var(--ease);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal {
      background: var(--surface);
      border-radius: var(--r-lg);
      border: 1px solid var(--border);
      box-shadow: var(--sh-xl);
      width: 100%;
      max-width: 500px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 28px;
      animation: slideUp 0.2s var(--ease);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-lg {
      max-width: 620px;
    }

    .modal-xl {
      max-width: 960px;
      width: 95vw;
    }

    .dual-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 16px 0;
    }

    @media (max-width: 780px) {
      .dual-panel {
        grid-template-columns: 1fr;
      }
    }

    .panel-box {
      background: var(--bg-warm);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 18px;
    }

    .safety-notice {
      background: #F4EFE6;
      border-left: 4px solid var(--gold);
      padding: 12px 16px;
      font-size: 12px;
      color: var(--ink-secondary);
      border-radius: 4px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .approval-gate-box {
      background: var(--brand-subtle);
      border: 1.5px solid var(--brand-mid);
      border-radius: var(--r-md);
      padding: 16px 20px;
      margin-top: 18px;
    }

    .blocked-alert {
      background: var(--alert-subtle);
      border: 1px solid #EEB9B0;
      color: var(--alert);
      padding: 12px 16px;
      border-radius: var(--r-sm);
      font-size: 13px;
      margin: 12px 0;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .queue-tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      flex-wrap: wrap;
    }

    .queue-tab-btn {
      padding: 8px 16px;
      border-radius: var(--r-full);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }

    .queue-tab-btn:hover {
      background: var(--surface-dim);
      color: var(--ink);
    }

    .queue-tab-btn.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
    }

    .pill-red {
      background: #FDE8E8;
      color: #9B1C1C;
    }

    .pill-orange {
      background: #FEF3C7;
      color: #92400E;
    }

    .pill-yellow {
      background: #FEF9C3;
      color: #854D0E;
    }

    .pill-green {
      background: #DCFCE7;
      color: #166534;
    }

    .pill-blue {
      background: #E0E7FF;
      color: #3730A3;
    }

    .pill-purple {
      background: #F3E8FF;
      color: #6B21A8;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .close-x {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--ink-muted);
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .close-x:hover {
      background: var(--surface-muted);
      color: var(--ink);
    }

    /* ---- QR CODE ---- */
    .qr-frame {
      width: 200px;
      height: 200px;
      margin: 20px auto;
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: var(--r-md);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---- TABLE ---- */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th {
      padding: 10px 16px;
      border-bottom: 2px solid var(--border);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--surface-dim);
      vertical-align: middle;
    }

    tr:hover td {
      background: var(--bg-warm);
    }

    /* ---- SPARKLINE ---- */
    .spark {
      width: 100%;
      height: 80px;
      overflow: visible;
    }

    /* ---- LANDING PAGE ---- */
    .landing-hero {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #13201D 0%, var(--brand) 45%, var(--brand-mid) 100%);
      position: relative;
      overflow: hidden;
      color: #fff;
      text-align: center;
    }

    .landing-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.04) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(40, 122, 104, 0.2) 0%, transparent 60%);
    }

    .landing-content {
      position: relative;
      z-index: 1;
      max-width: 720px;
      padding: 40px 24px;
    }

    .landing-features {
      max-width: 1080px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 28px;
      text-align: center;
      box-shadow: var(--sh-xs);
      transition: all 0.2s var(--ease);
    }

    .feature-card:hover {
      box-shadow: var(--sh-md);
      transform: translateY(-2px);
      border-color: var(--brand-tint);
    }

    .feature-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    /* ---- KPI STAT ---- */
    .kpi-card {
      text-align: center;
    }

    .kpi-value {
      font-family: var(--serif);
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
    }

    /* ---- ANIMATIONS ---- */
    @keyframes popIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .pop-in {
      animation: popIn 0.3s var(--ease-spring);
    }

    /* ---- TOAST NOTIFICATION ---- */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: #11201D;
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      border: 1px solid #2B4E42;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      font-size: 13.5px;
      font-weight: 600;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUpFade 0.25s var(--ease);
    }

    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translate(-50%, 16px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    /* ---- SCROLLBAR ---- */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-strong);
    }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 900px) {
      .app-header {
        padding: 0 14px;
        height: 56px;
        gap: 10px;
      }

      .grid-4 {
        grid-template-columns: repeat(2, 1fr);
      }

      .grid-3 {
        grid-template-columns: 1fr;
      }

      .role-tabs {
        overflow-x: auto;
      }

      .system-bar {
        padding: 6px 14px;
        font-size: 10px;
      }
    }

    @media (max-width: 520px) {
      .phone {
        width: 100%;
        border-radius: 0;
        box-shadow: none;
        height: calc(100vh - 120px);
      }

      .phone-wrap {
        padding: 0;
      }

      .phone-notch {
        display: none;
      }

      .pass-head {
        padding: 20px 16px 18px;

      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .grid-4 {
        grid-template-columns: 1fr;
      }

      .demo-banner {
        flex-direction: column;
        align-items: flex-start;
      }

      .role-tab {
        font-size: 11px;
        padding: 6px 10px;
      }
    }

    @media (max-width: 900px) and (min-width: 521px) {
      .phone {
        width: 380px;
        height: min(700px, calc(100vh - 140px));
        border-radius: 40px;
      }

      .phone-wrap {
        padding: 24px 16px;
      }
    }

</head>

    // ──── SPARKLINE SVG ────
    function buildSparkline() {
      const log = S.wellbeing || [
        { d: "05 Sep", energy: 3, pain: 2 },
        { d: "07 Sep", energy: 2, pain: 3 },
        { d: "09 Sep", energy: 4, pain: 1 },
        { d: "11 Sep", energy: 3, pain: 2 },
      ];
      const w = 380, h = 70, pad = 14;
      const step = (w - 2 * pad) / Math.max(1, log.length - 1);
      function path(key) {
        return log.map((l, i) => {
          const x = pad + i * step;
          const val = l[key] || 3;
          const y = h - pad - ((val - 1) / 4) * (h - 2 * pad);
          return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
      }
      return `<svg viewBox="0 0 ${w} ${h}" class="spark">
    <path d="${path('energy')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="${path('pain')}" fill="none" stroke="var(--alert)" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
    ${log.map((l, i) => `<text x="${pad + i * step}" y="${h - 1}" font-size="9" fill="var(--ink-muted)" text-anchor="middle" font-family="var(--sans)">${l.d}</text>`).join('')}
  </svg>`;
    }

                    <li><strong>${tk.title}</strong> — ${tk.aiSimplified.where} (Due: ${tk.due})</li>
                  `).join('')}
                </ul>
              </div>
            </div>
            <div class="flex gap-8">
              <button class="btn btn-brand btn-block" onclick="window.print()">🖨️ Print Summary Sheet</button>
              <button class="btn btn-outline" onclick="showToast('Secure care summary link copied.')">🔗 Copy Link</button>
            </div>
          </div>`,

        // 8. DISCHARGE SUMMARY UPLOAD
        upload: () => `
          <div class="modal">
            <div class="modal-head"><h3 style="font-size:18px;">Upload Discharge Summary</h3><button class="close-x" onclick="closeModal()">✕</button></div>
            <p class="text-sm text-muted mb-16">Upload a hospital discharge summary or OPD card. AI extracts instructions for oncologist verification.</p>
            <div style="border:2px dashed var(--border);border-radius:var(--r-md);padding:36px;text-align:center;color:var(--ink-muted);">
              <div style="font-size:36px;margin-bottom:8px;">📄</div>
              <div class="font-semibold">Drop Discharge PDF or Click to Browse</div>
              <div class="text-xs text-muted mt-4">Max 15 MB · PDF, DOC, Scan Image</div>
            </div>
            <button class="btn btn-brand btn-block mt-16" onclick="closeModal();showToast('Discharge Summary parsed. New draft queued for verification.');openModal('approval','T-103');">Upload & Parse Instructions</button>
          </div>`,

        // 9. TASK DETAIL MODAL
        taskDetail: () => {
          const taskId = payload || 'T-101';
          const tk = S.tasks.find(x => x.id === taskId) || S.tasks[0];
          const isDone = tk.status === 'completed' || tk.status === 'done';

          return `
          <div class="modal">
            <div class="modal-head">
              <div>
                <span class="pill pill-brand mb-4">${tk.category}</span>
                <h3 style="font-size:18px;">${t(tk.tK) || tk.title}</h3>
              </div>
              <button class="close-x" onclick="closeModal()">✕</button>
            </div>
            <div class="grid" style="gap:12px;">
              <div class="task-info-box"><strong>🤔 Why is this needed?</strong><p class="mt-4 text-secondary">${t(tk.wK) || tk.aiSimplified.why}</p></div>
              <div class="task-info-box"><strong>📍 Where to go?</strong><p class="mt-4 text-secondary">${t(tk.lK) || tk.aiSimplified.where}</p></div>
              <div class="task-info-box"><strong>ℹ️ What to do?</strong><p class="mt-4 text-secondary">${t(tk.aK) || tk.aiSimplified.what}</p></div>
              <div class="task-info-box"><strong>📅 When?</strong><p class="mt-4 text-secondary">Complete before ${tk.due}</p></div>
              <div class="task-info-box"><strong>🎒 What to bring?</strong><p class="mt-4 text-secondary">${tk.aiSimplified.bring}</p></div>
            </div>
            ${!isDone ? `<button class="btn btn-brand btn-block mt-16" onclick="doneTask('${tk.id}');closeModal();">✓ ${t('completed')}</button>` : `<div class="pill pill-brand w-full justify-center mt-16" style="padding:10px;">✓ Follow-up Completed & Closed</div>`}
          </div>`;
        }
      };

      const modalFn = modals[type];
      if (!modalFn) return;
      root.innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal();">${modalFn()}</div>`;
    }

    function closeModal() {
      document.getElementById('modalRoot').innerHTML = '';
    }

    // ──── APPROVAL GATE ACTIONS ────
    function toggleApprovalBtn() {
      const chk = document.getElementById('approvalCheck');
      const btn = document.getElementById('approveBtn');
      if (chk && btn) {
        btn.disabled = !chk.checked;
        btn.style.opacity = chk.checked ? '1' : '0.5';
        btn.style.cursor = chk.checked ? 'pointer' : 'not-allowed';
      }
    }

    function approveInstruction(taskId) {
      const tk = S.tasks.find(x => x.id === taskId);
      if (tk) {
        tk.status = 'approved';
        tk.approvalStatus = 'approved';
        tk.approvedBy = 'Dr. K. Rao';
        tk.approvedAt = 'Just now';
        tk.lastPatientActivity = 'Dispatched via WhatsApp link';
        tk.history.push({
          version: tk.version,
          type: "Clinician Approved",
          author: "Dr. K. Rao",
          time: "Just now",
          note: "Mandatory verification confirmed; approved for patient dispatch"
        });

        S.audit.unshift({
          time: "Just now",
          actor: "Dr. K. Rao",
          role: "Medical Oncologist",
          action: "Approved Patient Instruction",
          detail: `Verified '${tk.title}' (v${tk.version}) against clinical order; approved for dispatch`
        });

        closeModal();
        render();
        showToast(`✓ Clinical instruction '${tk.title}' verified & dispatched to patient!`);
      }
    }

    function toggleEditDraft(taskId) {
      const tk = S.tasks.find(x => x.id === taskId);
      if (!tk) return;

      const box = document.getElementById('patientDraftBox');
      const btn = document.getElementById('editDraftBtn');

      if (btn.textContent.includes('Edit')) {
        // Switch to inline inputs
        box.innerHTML = `
          <div><strong>What:</strong> <input id="editWhat" style="width:100%;margin-top:2px;padding:6px;font-size:12px;border:1px solid var(--border);border-radius:4px;" value="${tk.aiSimplified.what}"></div>
          <div class="mt-6"><strong>Why:</strong> <textarea id="editWhy" style="width:100%;margin-top:2px;padding:6px;font-size:12px;border:1px solid var(--border);border-radius:4px;min-height:50px;">${tk.aiSimplified.why}</textarea></div>
          <div class="mt-6"><strong>Where:</strong> <input id="editWhere" style="width:100%;margin-top:2px;padding:6px;font-size:12px;border:1px solid var(--border);border-radius:4px;" value="${tk.aiSimplified.where}"></div>
          <div class="mt-6"><strong>When:</strong> <input id="editWhen" style="width:100%;margin-top:2px;padding:6px;font-size:12px;border:1px solid var(--border);border-radius:4px;" value="${tk.aiSimplified.when}"></div>
          <div class="mt-6"><strong>Bring:</strong> <input id="editBring" style="width:100%;margin-top:2px;padding:6px;font-size:12px;border:1px solid var(--border);border-radius:4px;" value="${tk.aiSimplified.bring}"></div>
        `;
        btn.textContent = '💾 Save Clinician Edits (v2)';
        btn.className = 'btn btn-xs btn-brand';
      } else {
        // Save edits
        tk.aiSimplified.what = document.getElementById('editWhat').value;
        tk.aiSimplified.why = document.getElementById('editWhy').value;
        tk.aiSimplified.where = document.getElementById('editWhere').value;
        tk.aiSimplified.when = document.getElementById('editWhen').value;
        tk.aiSimplified.bring = document.getElementById('editBring').value;
        tk.clinicianModified = true;
        tk.version = 2;

        tk.history.push({
          version: 2,
          type: "Clinician Modified",
          author: "Dr. K. Rao",
          time: "Just now",
          note: "Doctor manually adjusted patient-facing simplified wording"
        });

        S.audit.unshift({
          time: "Just now",
          actor: "Dr. K. Rao",
          role: "Medical Oncologist",
          action: "Modified Patient Draft",
          detail: `Updated wording for '${tk.title}' -> tagged as v2 Clinician Modified`
        });

        openModal('approval', taskId);
        showToast('Instruction updated: Tagged as v2 Clinician Modified');
      }
    }

    function setTaskPreviewLang(taskId, langCode) {
      const tk = S.tasks.find(x => x.id === taskId);
      if (tk) {
        tk.targetLang = langCode;
        openModal('approval', taskId);
      }
    }

    function submitCreateInstruction() {
      const title = document.getElementById('newTitle').value;
      const cat = document.getElementById('newCat').value;
      const order = document.getElementById('newClinicalOrder').value;
      const targetLang = document.getElementById('newLang').value;
      const due = document.getElementById('newDue').value;

      const newId = 'T-' + (100 + S.tasks.length + 1);
      const newTask = {
        id: newId,
        title: title,
        category: cat,
        clinicalInstruction: order,
        aiSimplified: {
          what: `Undergo ${title}.`,
          why: "Doctor needs to evaluate organ safety before proceeding to next treatment cycle.",
          where: "Cardiac Evaluation Suite, Counter 2",
          when: `Before ${due}`,
          bring: "Previous ECG reports and OPD file"
        },
        tK: "t1_title", wK: "t1_why", aK: "t1_what", lK: "t1_where",
        due: due,
        status: "awaiting_approval",
        approvalStatus: "awaiting_approval",
        approvedBy: null,
        approvedAt: null,
        clinicianModified: false,
        version: 1,
        targetLang: targetLang,
        coordinatorAttention: false,
        coordinatorNotes: "Awaiting oncologist verification.",
        coordinatorAssigned: "Unassigned",
        lastPatientActivity: "Not dispatched",
        caregiverStatus: "Not sent",
        history: [
          { version: 1, type: "AI Generated Draft", author: "CareBridge AI", time: "Just now", note: "Auto-simplified from clinician order; awaiting verification gate" }
        ]
      };

      S.tasks.push(newTask);
      S.audit.unshift({
        time: "Just now",
        actor: "Dr. K. Rao",
        role: "Medical Oncologist",
        action: "Entered Clinical Order",
        detail: `Created order '${title}' -> AI generated draft (v1), queued for approval`
      });

      closeModal();
      render();
      showToast(`Order created! Opening mandatory verification gate for '${title}'...`);
      setTimeout(() => openModal('approval', newId), 400);
    }

    function resolveIntervention(taskId) {
      const tk = S.tasks.find(x => x.id === taskId) || S.tasks[0];
      const reason = document.getElementById('interveneReason') ? document.getElementById('interveneReason').value : "Transit barrier resolved";
      const notes = document.getElementById('interveneNotes') ? document.getElementById('interveneNotes').value : "Voucher provided; sample collected";

      tk.status = 'completed';
      tk.coordinatorAttention = false;
      tk.coordinatorNotes = notes;

      S.audit.unshift({
        time: "Just now",
        actor: "Ananya Sharma",
        role: "Care Coordinator",
        action: "Care-Loop Closure Resolved",
        detail: `Resolved '${tk.title}' barrier (${reason}). Notes: ${notes}`
      });

      S.helpReqs = [];
      S.queueTab = 'closed';

      closeModal();
      render();
      showToast(`✓ Care gap resolved: '${tk.title}' closed & recorded in audit trail!`);
    }

    // ──── GENERAL EVENT HANDLERS ────
    function showToast(msg) {
      let tElem = document.getElementById('toastMsg');
      if (!tElem) {
        tElem = document.createElement('div');
        tElem.id = 'toastMsg';
        tElem.className = 'toast';
        document.body.appendChild(tElem);
      }
      tElem.innerHTML = `<span style="font-size:16px;">✅</span> <span>${msg}</span>`;
      tElem.style.display = 'flex';
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { if (tElem) tElem.style.display = 'none'; }, 3500);
    }

    function switchRole(role) {
      S.view = role;
      closeModal();
      render();
    }

    function showLanding() {
      S.view = 'landing';
      closeModal();
      render();
    }

    function setLang(code) {
      S.lang = code;
      const d = document.getElementById('langDrop');
      if (d) d.classList.add('hidden');
      render();
    }

    function toggleLang() {
      const d = document.getElementById('langDrop');
      if (d) d.classList.toggle('hidden');
    }

    function setQueueTab(tabName) {
      S.queueTab = tabName;
      render();
    }

    function doneTask(id) {
      const tk = S.tasks.find(x => x.id === id);
      if (tk) {
        tk.status = 'completed';
        tk.coordinatorAttention = false;
        S.audit.unshift({
          time: "Just now",
          actor: S.patient.name,
          role: "Patient",
          action: "Completed Follow-Up Action",
          detail: `Marked '${tk.title}' as completed via Digital Pass`
        });
        render();
        showToast(`✓ Care loop closed: "${tk.title}" verified on Doctor Portal!`);
      }
    }

    function scanSim() {
      closeModal();
      doneTask('T-101');
      alert(`⚡ HOSPITAL RECEPTION SCANNER SUCCESS!\n\nPatient: ${S.patient.name} (${S.patient.mrn})\nOrder: Complete Blood Count (CBC)\nPhysician: ${S.patient.doctor}\n\nStatus: Central Laboratory Sample Collected`);
    }

    function submitCheckin() {
      closeModal();
      S.wellbeing.push({ d: "Today", energy: 4, pain: 1, nausea: 1 });
      if (S.wellbeing.length > 7) S.wellbeing.shift();
      S.checkins.push({ d: "Today", coping: 4, barrier: "None", notes: "Reported via check-in modal" });
      S.audit.unshift({
        time: "Just now",
        actor: S.patient.name,
        role: "Patient",
        action: "Submitted Coordination Check-in",
        detail: "Confirmed no active transit barrier; managing well"
      });
      showToast("Support check-in recorded. Care coordinator notified.");
      render();
    }

    function submitHelp() {
      closeModal();
      S.helpReqs.unshift({
        patient: S.patient.name,
        reason: "Transport assistance requested from rural village",
        status: "Open",
        time: "Just now",
        contact: "+91 98490 12345"
      });
      S.audit.unshift({
        time: "Just now",
        actor: S.patient.name,
        role: "Patient",
        action: "Assistance Request Submitted",
        detail: "Requested travel voucher for Central Lab visit"
      });
      showToast("Request received. Care coordinator Ananya Sharma has been notified.");
      render();
    }

    // ──── 13-STEP GUIDED GOVERNANCE DEMO ────
    const DEMO = [
      {
        num: 1,
        title: "CareBridge Philosophy: The Care-Loop Closure Layer",
        desc: "AI assists. Clinicians approve. Patients act. Coordinators intervene. CareBridge bridges oncology discharge and patient completion.",
        action: () => { S.view = 'landing'; closeModal(); render(); }
      },
      {
        num: 2,
        title: "Clinician Governance Dashboard & Operational KPIs",
        desc: "Oncologist dashboard tracking follow-up closures, pending approvals, and coordinator alerts with a clear safety boundary notice.",
        action: () => { S.view = 'clinician'; closeModal(); render(); }
      },
      {
        num: 3,
        title: "Unapproved Follow-Up Order (Blocked Dispatch)",
        desc: "Notice T-103 (Chest X-Ray) tagged 'Awaiting Clinician Approval'. It CANNOT be sent to the patient until verified.",
        action: () => { S.view = 'clinician'; closeModal(); render(); }
      },
      {
        num: 4,
        title: "Dual-Panel Mandatory Approval Gate",
        desc: "Oncologist reviews original clinical order on the left against AI-simplified What/Why/Where/When/Bring on the right.",
        action: () => { S.view = 'clinician'; render(); openModal('approval', 'T-103'); }
      },
      {
        num: 5,
        title: "Multilingual Preview & Clinician Editing (v2)",
        desc: "Clinicians can preview regional languages (e.g. Telugu) and edit the text. Manual edits are logged as 'Clinician Modified v2'.",
        action: () => {
          S.view = 'clinician'; render(); openModal('approval', 'T-103');
          setTaskPreviewLang('T-103', 'te');
        }
      },
      {
        num: 6,
        title: "Mandatory Verification Checkbox & Patient Dispatch",
        desc: "The dispatch button is locked until the doctor explicitly certifies clinical accuracy. Once approved, the pass link is dispatched.",
        action: () => {
          S.view = 'clinician'; render(); openModal('approval', 'T-103');
          const chk = document.getElementById('approvalCheck');
          if (chk) { chk.checked = true; toggleApprovalBtn(); }
        }
      },
      {
        num: 7,
        title: "Zero-App Patient Digital Follow-Up Pass",
        desc: "Patient Ramesh Varma opens his pass on mobile web via WhatsApp link or QR scan. No app install or login friction.",
        action: () => { S.view = 'patient'; S.lang = 'en'; closeModal(); render(); }
      },
      {
        num: 8,
        title: "Native Script Multilingual Rendering (Telugu)",
        desc: "Pass renders fluently in Telugu native script so patients and rural families clearly understand where to go and what to bring.",
        action: () => { S.view = 'patient'; S.lang = 'te'; closeModal(); render(); }
      },
      {
        num: 9,
        title: "Clinical Safety Rule: Gated Tasks Excluded",
        desc: "Notice that unapproved orders never display as actionable tasks. A safety status alert informs patient of pending verification.",
        action: () => { S.view = 'patient'; S.lang = 'en'; closeModal(); render(); }
      },
      {
        num: 10,
        title: "Patient Acknowledges & Closes CBC Follow-up",
        desc: "Patient taps 'Completed' for the CBC blood test. A real-time closed-loop acknowledgment updates the hospital system.",
        action: () => {
          S.view = 'patient'; S.lang = 'en'; closeModal();
          doneTask('T-101');
          render();
        }
      },
      {
        num: 11,
        title: "4-Tier At-Risk Closure Queue",
        desc: "Proactive safety net categorizing patients into Needs Attention, Due Soon, Awaiting Confirmation, and Closed.",
        action: () => { S.view = 'queue'; S.queueTab = 'needs_attention'; closeModal(); render(); }
      },
      {
        num: 12,
        title: "Coordinator Intervention & Care Gap Resolution",
        desc: "Care coordinator logs rural transit support, coordinates sample collection, and closes the care loop.",
        action: () => { S.view = 'queue'; S.queueTab = 'needs_attention'; render(); openModal('intervene', 'T-101'); }
      },
      {
        num: 13,
        title: "Tamper-Evident Forensic Audit Trail",
        desc: "Every AI generation, clinician sign-off, patient read, and coordinator resolution is permanently audited with timestamps.",
        action: () => { S.view = 'audit'; closeModal(); render(); }
      }
    ];

    function toggleDemo() {
      S.demoActive = !S.demoActive;
      const b = document.getElementById('demoBanner');
      if (b) b.classList.toggle('hidden', !S.demoActive);
      if (S.demoActive) {
        S.demoStep = 0;
        applyDemoStep(0);
      }
    }

    function startDemo() {
      S.demoActive = true;
      const b = document.getElementById('demoBanner');
      if (b) b.classList.remove('hidden');
      S.demoStep = 0;
      applyDemoStep(0);
    }

    function nextDemoStep() {
      if (S.demoStep < DEMO.length - 1) {
        S.demoStep++;
        applyDemoStep(S.demoStep);
      } else {
        toggleDemo();
        showToast("✨ 13-Step Governance Walkthrough Complete!");
      }
    }

    function prevDemoStep() {
      if (S.demoStep > 0) {
        S.demoStep--;
        applyDemoStep(S.demoStep);
      }
    }

    function resetDemoSteps() {
      S.demoStep = 0;
      applyDemoStep(0);
    }

    function applyDemoStep(idx) {
      const s = DEMO[idx];
      if (!s) return;

      document.getElementById('demoNum').textContent = s.num;
      document.getElementById('demoTitle').textContent = s.title;
      document.getElementById('demoDesc').textContent = s.desc;

      // Render dots
      const dotsEl = document.getElementById('demoDots');
      if (dotsEl) {
        dotsEl.innerHTML = DEMO.map((_, i) => `
          <div class="demo-dot ${i === idx ? 'active' : ''}" onclick="S.demoStep=${i};applyDemoStep(${i})"></div>
        `).join('');
      }

      // Execute step action
      s.action();
    }

    // ──── CLICK OUTSIDE TO CLOSE LANG DROPDOWN ────
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.lang-wrap')) {
        const d = document.getElementById('langDrop');
        if (d) d.classList.add('hidden');
      }
    });

    // ──── INIT ────
    render();
  </script>
</body>

</html>
